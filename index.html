<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>加速度立体表示</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #080808;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}

#canvas {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;
}

#ui {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;

    padding:
        calc(env(safe-area-inset-top) + 12px)
        15px
        15px
        15px;

    pointer-events: none;
}

button {

    pointer-events: auto;

    border: none;

    border-radius: 10px;

    padding:
        12px 18px;

    font-size: 16px;

    color: white;

    background: #1976d2;
}

#data {

    margin-top: 12px;

    display: inline-block;

    padding: 10px 13px;

    border-radius: 10px;

    background:
        rgba(0,0,0,0.65);

    font-family: monospace;

    font-size: 14px;

    line-height: 1.55;
}

#gravityControl {

    margin-top: 10px;

    display: block;

    pointer-events: auto;

    font-size: 14px;
}

#gravityControl input {

    width: 18px;
    height: 18px;

    vertical-align: middle;
}

#status {

    margin-top: 8px;

    font-size: 12px;

    color: #aaa;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="ui">

    <button id="start">
        加速度センサーを開始
    </button>

    <div id="gravityControl">

        <label>
            <input
                type="checkbox"
                id="includeGravity"
                checked
            >
            重力を含める
        </label>

    </div>

    <div id="data">

        X : 0.00 m/s²<br>
        Y : 0.00 m/s²<br>
        Z : 0.00 m/s²<br>
        |a| : 0.00 m/s²

    </div>

    <div id="status">
        センサー停止中
    </div>

</div>


<script>

"use strict";


/* =========================================================
   Canvas
   ========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;

let cx = 0;
let cy = 0;

let dpr = 1;


function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    cx =
        width / 2;

    cy =
        height / 2;
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   加速度
   ========================================================= */

let acceleration = {

    x: 0,
    y: 0,
    z: 0
};


/*
 * 重力を含む値
 */

let accelerationGravity = {

    x: 0,
    y: 0,
    z: 0
};


/* =========================================================
   センサー
   ========================================================= */

let sensorRunning = false;


function onMotion(event) {

    /*
     * 重力を含まない加速度
     */

    if (event.acceleration) {

        acceleration.x =
            event.acceleration.x ?? 0;

        acceleration.y =
            event.acceleration.y ?? 0;

        acceleration.z =
            event.acceleration.z ?? 0;
    }


    /*
     * 重力を含む加速度
     */

    if (event.accelerationIncludingGravity) {

        accelerationGravity.x =
            event.accelerationIncludingGravity.x ?? 0;

        accelerationGravity.y =
            event.accelerationIncludingGravity.y ?? 0;

        accelerationGravity.z =
            event.accelerationIncludingGravity.z ?? 0;
    }
}


/* =========================================================
   センサー開始
   ========================================================= */

async function startSensors() {

    try {

        /*
         * iOS
         */

        if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission ===
                "function"
        ) {

            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {

                alert(
                    "加速度センサーへのアクセスが許可されませんでした。"
                );

                return;
            }
        }


        window.addEventListener(
            "devicemotion",
            onMotion,
            true
        );


        sensorRunning = true;


        document
            .getElementById("start")
            .style.display = "none";


        document
            .getElementById("status")
            .textContent =
                "センサー動作中";


    } catch (error) {

        console.error(error);

        alert(
            "センサーを開始できませんでした。\n" +
            error
        );
    }
}


document
    .getElementById("start")
    .addEventListener(
        "click",
        startSensors
    );


/* =========================================================
   現在使用する加速度
   ========================================================= */

function getAcceleration() {

    const includeGravity =
        document
            .getElementById("includeGravity")
            .checked;

    if (includeGravity) {

        return {

            x: accelerationGravity.x,
            y: accelerationGravity.y,
            z: accelerationGravity.z
        };

    } else {

        return {

            x: acceleration.x,
            y: acceleration.y,
            z: acceleration.z
        };
    }
}


/* =========================================================
   3Dベクトル演算
   ========================================================= */

function rotateX(v, angle) {

    const c =
        Math.cos(angle);

    const s =
        Math.sin(angle);

    return {

        x: v.x,

        y:
            v.y * c -
            v.z * s,

        z:
            v.y * s +
            v.z * c
    };
}


function rotateY(v, angle) {

    const c =
        Math.cos(angle);

    const s =
        Math.sin(angle);

    return {

        x:
            v.x * c +
            v.z * s,

        y:
            v.y,

        z:
            -v.x * s +
            v.z * c
    };
}


function rotateZ(v, angle) {

    const c =
        Math.cos(angle);

    const s =
        Math.sin(angle);

    return {

        x:
            v.x * c -
            v.y * s,

        y:
            v.x * s +
            v.y * c,

        z:
            v.z
    };
}


/* =========================================================
   3D → 2D 射影
   ========================================================= */

/*
 * カメラは +Z方向を見ている。
 *
 * ここでは分かりやすさを優先して
 * 比較的弱い透視投影にする。
 */

const cameraZ = 6.0;


/*
 * 3D空間1単位を
 * 画面上何pxにするか
 */

const pixelsPerUnit = 120;


function project(v) {

    /*
     * カメラとの距離
     */

    const distance =
        cameraZ - v.z;


    /*
     * カメラの後ろに行った場合
     */

    if (distance <= 0.1) {

        return null;
    }


    /*
     * 透視投影係数
     */

    const perspective =
        cameraZ / distance;


    return {

        x:
            cx +
            v.x *
            pixelsPerUnit *
            perspective,

        y:
            cy -
            v.y *
            pixelsPerUnit *
            perspective,

        z:
            v.z,

        scale:
            perspective
    };
}


/* =========================================================
   3D線
   ========================================================= */

function drawLine3D(
    a,
    b,
    lineWidth = 1,
    alpha = 1
) {

    const pa =
        project(a);

    const pb =
        project(b);

    if (!pa || !pb)
        return;


    ctx.beginPath();

    ctx.moveTo(
        pa.x,
        pa.y
    );

    ctx.lineTo(
        pb.x,
        pb.y
    );

    ctx.lineWidth =
        lineWidth;

    ctx.strokeStyle =
        `rgba(255,255,255,${alpha})`;

    ctx.stroke();
}


/* =========================================================
   3D座標軸
   ========================================================= */

function drawAxes() {

    const L = 2.0;


    /*
     * X軸
     */

    drawLine3D(
        {
            x: -L,
            y: 0,
            z: 0
        },

        {
            x: L,
            y: 0,
            z: 0
        },

        2,
        0.8
    );


    /*
     * Y軸
     */

    drawLine3D(
        {
            x: 0,
            y: -L,
            z: 0
        },

        {
            x: 0,
            y: L,
            z: 0
        },

        2,
        0.8
    );


    /*
     * Z軸
     */

    drawLine3D(
        {
            x: 0,
            y: 0,
            z: -L
        },

        {
            x: 0,
            y: 0,
            z: L
        },

        2,
        0.8
    );
}


/* =========================================================
   3Dグリッド
   ========================================================= */

function drawGrid() {

    const size = 2;

    const step = 0.5;


    /*
     * XY平面
     */

    for (
        let x = -size;
        x <= size;
        x += step
    ) {

        drawLine3D(

            {
                x: x,
                y: -size,
                z: 0
            },

            {
                x: x,
                y: size,
                z: 0
            },

            1,
            0.18
        );
    }


    for (
        let y = -size;
        y <= size;
        y += step
    ) {

        drawLine3D(

            {
                x: -size,
                y: y,
                z: 0
            },

            {
                x: size,
                y: y,
                z: 0
            },

            1,
            0.18
        );
    }
}


/* =========================================================
   矢印
   ========================================================= */

function drawArrow(v) {

    /*
     * 加速度ベクトルの大きさ
     */

    const magnitude =
        Math.sqrt(
            v.x * v.x +
            v.y * v.y +
            v.z * v.z
        );


    if (magnitude < 0.001)
        return;


    /*
     * m/s² → 3D空間
     *
     * 1 m/s² = 0.25 scene unit
     */

    const scale = 0.25;


    const tip = {

        x:
            v.x * scale,

        y:
            v.y * scale,

        z:
            v.z * scale
    };


    /*
     * ベクトル本体
     */

    drawLine3D(

        {
            x: 0,
            y: 0,
            z: 0
        },

        tip,

        6,
        1
    );


    /*
     * 矢印先端
     */

    const length =
        Math.sqrt(
            tip.x * tip.x +
            tip.y * tip.y +
            tip.z * tip.z
        );


    if (length < 0.001)
        return;


    /*
     * 単位ベクトル
     */

    const u = {

        x:
            tip.x / length,

        y:
            tip.y / length,

        z:
            tip.z / length
    };


    /*
     * 矢印の長さ
     */

    const headLength =
        Math.min(
            0.35,
            length * 0.35
        );


    /*
     * 矢印の基部
     */

    const base = {

        x:
            tip.x -
            u.x * headLength,

        y:
            tip.y -
            u.y * headLength,

        z:
            tip.z -
            u.z * headLength
    };


    /*
     * uに垂直なベクトルを作る
     */

    let side;


    if (
        Math.abs(u.z) < 0.9
    ) {

        side = {

            x: -u.y,

            y: u.x,

            z: 0
        };

    } else {

        side = {

            x: 0,

            y: -u.z,

            z: u.y
        };
    }


    const sideLength =
        Math.sqrt(
            side.x * side.x +
            side.y * side.y +
            side.z * side.z
        );


    side.x /=
        sideLength;

    side.y /=
        sideLength;

    side.z /=
        sideLength;


    const arrowWidth =
        Math.min(
            0.14,
            length * 0.15
        );


    /*
     * 矢印の左右
     */

    const p1 = {

        x:
            base.x +
            side.x * arrowWidth,

        y:
            base.y +
            side.y * arrowWidth,

        z:
            base.z +
            side.z * arrowWidth
    };


    const p2 = {

        x:
            base.x -
            side.x * arrowWidth,

        y:
            base.y -
            side.y * arrowWidth,

        z:
            base.z -
            side.z * arrowWidth
    };


    drawLine3D(
        tip,
        p1,
        5,
        1
    );

    drawLine3D(
        tip,
        p2,
        5,
        1
    );
}


/* =========================================================
   加速度表示
   ========================================================= */

function updateData(v) {

    const magnitude =
        Math.sqrt(
            v.x * v.x +
            v.y * v.y +
            v.z * v.z
        );


    document
        .getElementById("data")
        .innerHTML =

        `X : ${v.x.toFixed(2)} m/s²<br>` +
        `Y : ${v.y.toFixed(2)} m/s²<br>` +
        `Z : ${v.z.toFixed(2)} m/s²<br>` +
        `|a| : ${magnitude.toFixed(2)} m/s²`;
}


/* =========================================================
   レンダリング
   ========================================================= */

function render() {

    /*
     * 背景
     */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.fillStyle =
        "#080808";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
     * 3D座標系
     */

    drawGrid();

    drawAxes();


    /*
     * 加速度
     */

    const v =
        getAcceleration();


    /*
     * 今回は端末の姿勢による
     * 回転をまだ加えない。
     *
     * まず「センサー値そのもの」を
     * 正確に3D表示する。
     */

    drawArrow(v);


    /*
     * 数値表示
     */

    updateData(v);


    requestAnimationFrame(
        render
    );
}


render();

</script>

</body>
</html>
